# Staging and production on the ZimaOS box, behind the Cloudflare Tunnel.
#
# Dev (:3007) and preview (:3008) are not here on purpose -- they run as plain
# Node processes on the development machine and are not part of this file.
#
#   docker compose build
#   docker compose up -d staging
#   docker compose up -d production
#   docker compose logs -f production
#
# Both services run the SAME image. What differs is the environment file, the
# volume, and the port -- so a release that passed on staging is the identical
# artifact promoted to production, not a rebuild that might not be.

x-lifegate: &lifegate
  image: lifegate:latest
  build:
    context: .
  restart: unless-stopped
  # Published on loopback only. The container listens on 0.0.0.0 inside its own
  # network namespace; reaching it from outside the box is the tunnel's job, and
  # binding to 127.0.0.1 here means nothing else on the LAN can skip it.
  # (The Dockerfile's HEALTHCHECK is inherited; no need to repeat it.)
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  staging:
    <<: *lifegate
    container_name: lifegate-staging
    env_file: .env.staging
    environment:
      # Set here rather than only in the env file so the two can never drift:
      # this is what stops staging sending real mail to the congregation
      # (server/lib/mail.ts refuses any transport but SMTP unless APP_ENV is
      # exactly "production").
      APP_ENV: staging
      NUXT_PUBLIC_SITE_URL: https://staging.lifegate.bible
      NUXT_PUBLIC_INDEXABLE: 'false'
    ports:
      - '127.0.0.1:3009:3000'
    volumes:
      - staging-data:/app/.data

  production:
    <<: *lifegate
    container_name: lifegate-production
    env_file: .env.production
    environment:
      APP_ENV: production
      # Points at new.lifegate.bible until the church goes live; at that point
      # this becomes https://lifegate.bible and INDEXABLE becomes true. Both are
      # read per request, so it is an edit here and a restart -- no rebuild.
      NUXT_PUBLIC_SITE_URL: https://new.lifegate.bible
      NUXT_PUBLIC_INDEXABLE: 'false'
    ports:
      - '127.0.0.1:3010:3000'
    volumes:
      - production-data:/app/.data

volumes:
  # The database and the member photos. Named rather than bind-mounted so a
  # stray `docker compose down -v` is the only way to lose them, and so the
  # two environments cannot be pointed at one directory by accident.
  #
  # These are NOT backed up by existing here. See README for the dump job --
  # a SQLite file copied while it is being written is not a usable backup.
  staging-data:
  production-data:
