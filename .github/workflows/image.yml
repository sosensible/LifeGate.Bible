# Build the container image for the ZimaOS box and publish it to GHCR.
#
# This exists because the deploy target is Intel and the development machine is
# Apple Silicon. `.output/` carries better-sqlite3's compiled .node file, so the
# image has to be built on -- or emulated as -- amd64. GitHub's runners are
# amd64 natively, which makes this the fastest and least error-prone place to
# build it: no QEMU, and no way to accidentally ship the laptop's binary.
#
# It also solves getting the image onto the box. ZimaOS has no registry-login
# UI, so the package this publishes should be made PUBLIC once (GHCR package
# settings -> Change visibility), after which the App Store pulls it with no
# credentials and no SSH. The repository itself can stay private.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # A newer commit makes an in-flight build pointless; let it go.
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit specs only. tests/e2e/homepage.spec.ts runs in @nuxt/test-utils
      # "host" mode against the dev server on 127.0.0.1:3007, so it passes on a
      # developer's machine purely because that server happens to be running,
      # and cannot pass here. The image job below exercises the real artifact
      # instead, which is a better end-to-end check than a dev server anyway.
      - run: npx vitest run tests/unit

  image:
    name: build and push
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # GHCR rejects an uppercase path, and GitHub account names may contain
      # capitals; derive the name rather than hard-coding one.
      - name: Work out the image name and version
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lifegate-church" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The runner is already amd64, so this is a statement of intent
          # rather than a cross-build. The Dockerfile pins both stages too.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the real artifact and ask it for a page. This is the check that
      # matters: it proves the native SQLite module loads on amd64, that the
      # migrations build a database from an empty volume, and that the site
      # serves -- the three things that can only fail on the target.
      #
      # Throwaway secrets: nothing here reaches a real person. APP_ENV is
      # deliberately not "production", so even a misconfigured mail setting
      # cannot send (server/lib/mail.ts).
      - name: Boot the image and serve a page
        run: |
          docker run -d --name smoke --platform linux/amd64 \
            -e APP_ENV=ci \
            -e BETTER_AUTH_SECRET=ci-only-not-a-real-secret-32-bytes-x \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000 \
            -e MAIL_TRANSPORT=smtp \
            -p 3000:3000 \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "Served a page on attempt $i."
              ok=1; break
            fi
            sleep 2
          done

          echo "--- container log ---"
          docker logs smoke

          if [ "${ok:-0}" != "1" ]; then
            echo "::error::The image never served a page. See the log above."
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi

          # The migration plugin announces itself; its absence means the schema
          # was never applied and the database is not what we think it is.
          docker logs smoke 2>&1 | grep -q '\[migrate\]' \
            || { echo "::error::No migration ran."; docker rm -f smoke; exit 1; }

          docker rm -f smoke >/dev/null

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "Set that as \`image:\` in \`deploy/zimaos-compose.yaml\` and reinstall the custom app."
            echo
            echo "If this is the first push, make the package public once:"
            echo "GHCR package → Package settings → Change visibility → Public."
          } >> "$GITHUB_STEP_SUMMARY"
