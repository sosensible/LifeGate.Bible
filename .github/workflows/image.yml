# Build the container image for the ZimaOS box and publish it to GHCR.
#
# This exists because the deploy target is Intel and the development machine is
# Apple Silicon. `.output/` carries better-sqlite3's compiled .node file, so the
# image has to be built on -- or emulated as -- amd64. GitHub's runners are
# amd64 natively, which makes this the fastest and least error-prone place to
# build it: no QEMU, and no way to accidentally ship the laptop's binary.
#
# It also solves getting the image onto the box. ZimaOS has no registry-login
# UI, so the package this publishes should be made PUBLIC once (GHCR package
# settings -> Change visibility), after which the App Store pulls it with no
# credentials and no SSH. The repository itself can stay private.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # A newer commit makes an in-flight build pointless; let it go.
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Publishing an image that fails its own tests helps nobody.
      - run: npx vitest run

  image:
    name: build and push
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # GHCR rejects an uppercase path, and GitHub account names may contain
      # capitals; derive the name rather than hard-coding one.
      - name: Work out the image name and version
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lifegate-church" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The runner is already amd64, so this is a statement of intent
          # rather than a cross-build. The Dockerfile pins both stages too.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is useless if the native module inside it is wrong for the
      # target, and that is exactly the failure this whole pipeline exists to
      # prevent -- so prove it here rather than discovering it on the box.
      # The entrypoint runs the check and then `true` instead of the server.
      - name: Check the image actually runs on amd64
        run: |
          docker run --rm --platform linux/amd64 \
            ${{ steps.meta.outputs.image }}:${{ github.sha }} true
          echo "Native module loaded on linux/amd64."

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "Set that as \`image:\` in \`deploy/zimaos-compose.yaml\` and reinstall the custom app."
            echo
            echo "If this is the first push, make the package public once:"
            echo "GHCR package → Package settings → Change visibility → Public."
          } >> "$GITHUB_STEP_SUMMARY"
